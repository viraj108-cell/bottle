<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A bottle washed up for you</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #24395e;
    --sky-mid: #6a6f97;
    --horizon: #f0b48c;
    --sea-deep: #173f52;
    --foam: #d8eee8;
    --glass: rgba(150, 210, 190, 0.38);
    --glass-edge: rgba(225, 248, 240, 0.75);
    --paper: #f3e6c6;
    --paper-shade: #e2cfa2;
    --ink: #3b2a1c;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --hand: "Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    font-family: var(--display);
    color: #f6efe4;
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 38%, var(--horizon) 56%, var(--sea-deep) 56.2%, #0f2e3d 100%);
  }

  .sun {
    position: absolute; left: 50%; top: 56%;
    width: 140px; height: 140px; transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #ffe1b8 0%, #f7c08f 45%, rgba(247,192,143,0) 70%);
    clip-path: inset(0 0 50% 0);
    opacity: .9;
  }
  .glint {
    position: absolute; left: 50%; top: 56.5%;
    width: 46px; height: 30%;
    transform: translateX(-50%);
    background: repeating-linear-gradient(to bottom, rgba(255,214,170,.55) 0 3px, transparent 3px 11px);
    filter: blur(1px);
    opacity: .5;
    mask-image: linear-gradient(to bottom, #000, transparent);
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent);
  }

  .intro {
    position: absolute; top: max(9vh, calc(env(safe-area-inset-top, 0px) + 24px)); left: 0; right: 0;
    text-align: center; padding: 0 24px;
    transition: opacity .6s ease, transform .6s ease;
  }
  .intro h1 {
    font-weight: 400; font-style: italic;
    font-size: clamp(1.9rem, 6vw, 3rem);
    line-height: 1.1; margin: 0 0 .5rem;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 18px rgba(20, 30, 60, .35);
  }
  .intro p { margin: 0; font-size: 1.05rem; opacity: .85; }

  .wave {
    position: absolute; left: 0; width: 200%;
    pointer-events: none;
  }
  .wave svg { display: block; width: 100%; height: 100%; }
  .wave.back  { top: 60%; height: 60px; opacity: .55; animation: drift 14s linear infinite; }
  .wave.mid   { top: 66%; height: 70px; opacity: .8;  animation: drift 10s linear infinite reverse; }
  .wave.front { top: 72%; height: 90px; z-index: 3; animation: drift 8s linear infinite; }
  .deep {
    position: absolute; left: 0; right: 0; bottom: 0;
    top: calc(72% + 88px); z-index: 3; pointer-events: none;
    background: linear-gradient(to bottom, #163f50, #0f2e3d);
  }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .bottle {
    position: absolute; left: 50%; top: 75%;
    width: 120px; height: 220px;
    margin: -110px 0 0 -60px;
    padding: 0; border: 0; background: none; cursor: pointer;
    z-index: 2;
    transform: rotate(-68deg);
    animation: bob 3.6s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .bottle:focus-visible { outline: 3px dashed var(--foam); outline-offset: 10px; border-radius: 30px; }
  .bottle svg { width: 100%; height: 100%; overflow: visible; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-68deg); }
    50% { transform: translateY(-12px) rotate(-60deg); }
  }
  .bottle:disabled { cursor: default; }

  .cork { transform-box: fill-box; transform-origin: center; }

  body.opening .intro { opacity: 0; transform: translateY(-10px); }
  body.opening .bottle {
    animation: rise 1.1s cubic-bezier(.3,.7,.2,1) forwards;
  }
  @keyframes rise {
    0%   { transform: translateY(0) rotate(-64deg) scale(1); }
    100% { transform: translateY(-32vh) rotate(-8deg) scale(1.15); }
  }
  body.opening .cork { animation: pop .7s 1.05s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes pop {
    0%   { transform: translate(0,0) rotate(0); opacity: 1; }
    100% { transform: translate(60px,-140px) rotate(160deg); opacity: 0; }
  }
  body.opening .inner-scroll { animation: slideout .6s 1.55s ease-in forwards; }
  @keyframes slideout {
    to { transform: translateY(-150px); opacity: 0; }
  }
  body.opened .bottle { opacity: 0; transition: opacity .5s ease; pointer-events: none; }

  .veil {
    position: fixed; inset: 0; z-index: 4;
    background: rgba(12, 28, 40, .45);
    opacity: 0; pointer-events: none;
    transition: opacity .6s ease;
  }
  body.opened .veil { opacity: 1; }

  .letter {
    position: fixed; z-index: 5;
    left: 50%; top: 50%;
    width: min(88vw, 430px);
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
    visibility: hidden;
  }
  body.opened .letter { visibility: visible; }
  .rod {
    width: 100%; height: 26px; border-radius: 13px;
    background: linear-gradient(to bottom, #d8c290 0%, #f6ead0 40%, #c9b07a 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
    position: relative; z-index: 1;
  }
  .rod::before, .rod::after {
    content: ""; position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px;
    border-radius: 50%; background: #7a5634;
  }
  .rod::before { left: -6px; }
  .rod::after  { right: -6px; }
  .paper {
    width: 94%;
    max-height: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.35), transparent 60%),
      linear-gradient(to right, var(--paper-shade), var(--paper) 8%, var(--paper) 92%, var(--paper-shade));
    color: var(--ink);
    margin: -13px 0;
    transition: max-height 1.2s cubic-bezier(.25,.8,.25,1);
  }
  body.opened .paper { max-height: 72vh; overflow-y: auto; }
  .paper-inner { padding: 40px 30px 34px; }
  .message {
    font-family: var(--hand);
    font-weight: 500;
    font-size: clamp(1.55rem, 5.2vw, 1.9rem);
    line-height: 1.3;
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    opacity: 0;
    transition: opacity .8s .9s ease;
  }
  .sign {
    margin: 1.4rem 0 0;
    font-style: italic; font-size: .95rem; line-height: 1.5;
    color: #6b5236;
    opacity: 0;
    transition: opacity .8s 1.3s ease;
  }
  body.opened .message, body.opened .sign { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .wave, .bottle { animation: none !important; }
    .bottle { transform: rotate(-64deg); }
    body.opening .bottle, body.opening .cork, body.opening .inner-scroll { animation: none !important; }
    .paper, .message, .sign, .veil, .intro { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="sun" aria-hidden="true"></div>
  <div class="glint" aria-hidden="true"></div>

  <header class="intro">
    <h1 id="headline">Something washed up for you.</h1>
    <p id="hint">Tap the bottle to open it.</p>
  </header>

  <div class="wave back" aria-hidden="true">
    <svg viewBox="0 0 1200 60" preserveAspectRatio="none"><path fill="#2d6f80" d="M0 30 Q75 10 150 30 T300 30 T450 30 T600 30 T750 30 T900 30 T1050 30 T1200 30 V60 H0 Z"/></svg>
  </div>
  <div class="wave mid" aria-hidden="true">
    <svg viewBox="0 0 1200 70" preserveAspectRatio="none"><path fill="#1f5768" d="M0 35 Q100 12 200 35 T400 35 T600 35 T800 35 T1000 35 T1200 35 V70 H0 Z"/></svg>
  </div>

  <button class="bottle" id="bottle" type="button" aria-label="Open the bottle">
    <svg viewBox="0 0 120 220" aria-hidden="true">
      <g class="inner-scroll">
        <rect x="41" y="96" width="38" height="92" rx="7" fill="#f3e6c6"/>
        <rect x="41" y="96" width="8" height="92" rx="4" fill="#dcc79a"/>
        <rect x="41" y="136" width="38" height="6" fill="#a7463a"/>
      </g>
      <path d="M45 40 L45 62 C45 72 20 80 20 100 L20 196 Q20 210 34 210 L86 210 Q100 210 100 196 L100 100 C100 80 75 72 75 62 L75 40 Z"
            fill="rgba(150,210,190,0.38)" stroke="rgba(225,248,240,0.8)" stroke-width="2.5"/>
      <path d="M30 104 C30 92 38 86 44 82" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
      <path d="M29 116 L29 186" stroke="rgba(255,255,255,.35)" stroke-width="5" stroke-linecap="round"/>
      <rect x="41" y="34" width="38" height="9" rx="3" fill="rgba(190,230,215,.7)" stroke="rgba(225,248,240,.8)" stroke-width="1.5"/>
      <g class="cork">
        <rect x="46" y="12" width="28" height="26" rx="5" fill="#a9774a"/>
        <rect x="46" y="12" width="28" height="7" rx="3.5" fill="#c4935f"/>
        <circle cx="54" cy="27" r="1.6" fill="#7d5532"/>
        <circle cx="64" cy="31" r="1.3" fill="#7d5532"/>
      </g>
    </svg>
  </button>

  <div class="wave front" aria-hidden="true">
    <svg viewBox="0 0 1200 90" preserveAspectRatio="none"><path fill="#163f50" d="M0 40 Q75 22 150 40 T300 40 T450 40 T600 40 T750 40 T900 40 T1050 40 T1200 40 V90 H0 Z"/><path fill="none" stroke="#d8eee8" stroke-opacity=".35" stroke-width="2" d="M0 40 Q75 22 150 40 T300 40 T450 40 T600 40 T750 40 T900 40 T1050 40 T1200 40"/></svg>
  </div>

  <div class="deep" aria-hidden="true"></div>

  <div class="veil" aria-hidden="true"></div>

  <section class="letter" id="letter" aria-live="polite">
    <div class="rod" aria-hidden="true"></div>
    <div class="paper">
      <div class="paper-inner">
        <p class="message" id="message"></p>
        <p class="sign">Written by a classmate, in their own words. They were thinking of whoever found this.</p>
      </div>
    </div>
    <div class="rod" aria-hidden="true"></div>
  </section>

<script>
  function decodeMessage(hash) {
    var code = (hash || "").replace(/^#/, "").trim();
    if (!code) return null;
    try {
      var b64 = code.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) b64 += "=";
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var text = new TextDecoder("utf-8", { fatal: true }).decode(bytes).trim();
      return text || null;
    } catch (e) {
      return null;
    }
  }

  var msg = decodeMessage(location.hash);
  var bottle = document.getElementById("bottle");

  if (!msg) {
    document.getElementById("headline").textContent = "This bottle is empty.";
    document.getElementById("hint").textContent = "Open the link from your email to find your message.";
    bottle.disabled = true;
    bottle.setAttribute("aria-label", "Empty bottle");
  } else {
    document.getElementById("message").textContent = msg;
  }

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  bottle.addEventListener("click", function () {
    if (!msg || document.body.classList.contains("opening")) return;
    bottle.disabled = true;
    document.body.classList.add("opening");
    setTimeout(function () {
      document.body.classList.add("opened");
    }, reduced ? 0 : 2050);
  });
</script>
</body>
</html>
