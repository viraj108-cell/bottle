<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fill a bottle</title>
<style>
  body { font-family: Georgia, "Times New Roman", serif; background: #1d3a52; color: #f3e6c6; margin: 0; padding: 32px 20px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-weight: 400; font-style: italic; margin: 0 0 8px; }
  p { line-height: 1.5; opacity: .9; }
  label { display: block; margin: 20px 0 6px; }
  textarea, input { width: 100%; box-sizing: border-box; font: inherit; font-size: 1rem; padding: 10px; border-radius: 8px; border: 1px solid #6d8fa0; background: #f3e6c6; color: #3b2a1c; }
  textarea { min-height: 140px; }
  button { margin-top: 14px; font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; background: #d8eee8; color: #173f52; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #f0b48c; outline-offset: 2px; }
  #out { margin-top: 20px; word-break: break-all; }
  a { color: #f0b48c; }
</style>
</head>
<body>
<main>
  <h1>Fill a bottle</h1>
  <p>Paste a message to get a link that opens it in a bottle. The message lives inside the link, so nothing is stored anywhere.</p>
  <label for="msg">Message</label>
  <textarea id="msg"></textarea>
  <button id="make" type="button">Create link</button>
  <div id="out"></div>
</main>
<script>
  var base = location.href.replace(/[#?].*$/, "").replace(/make\.html$/, "");
  function encode(text) {
    var bytes = new TextEncoder().encode(text.trim());
    var bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  document.getElementById("make").addEventListener("click", function () {
    var text = document.getElementById("msg").value;
    var out = document.getElementById("out");
    out.textContent = "";
    if (!text.trim()) { out.textContent = "Type a message first."; return; }
    var link = base + "#" + encode(text);
    var a = document.createElement("a");
    a.href = link; a.target = "_blank"; a.textContent = link;
    var copy = document.createElement("button");
    copy.type = "button"; copy.textContent = "Copy link";
    copy.addEventListener("click", function () {
      navigator.clipboard.writeText(link).then(function () { copy.textContent = "Copied"; });
    });
    out.appendChild(a); out.appendChild(document.createElement("br")); out.appendChild(copy);
  });
</script>
</body>
</html>
