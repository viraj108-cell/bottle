<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Host · Message in a Bottle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 600px; }
  .code { font-family: var(--display); font-size: clamp(2.6rem, 11vw, 4rem); letter-spacing: .18em; text-align: center; margin: 4px 0 6px; color: var(--sea); }
  .qr { display: flex; justify-content: center; margin: 14px 0; }
  .qr img, .qr canvas { background: #fff; padding: 10px; border-radius: 10px; }
  .link { word-break: break-all; text-align: center; font-size: .95rem; color: var(--muted); margin: 0 0 12px; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .count { text-align: center; font-size: 1.5rem; margin: 26px 0 4px; }
  .count strong { font-size: 2.4rem; display: block; color: #fff6ea; font-weight: 400; }
  .release { display: block; margin: 18px auto 10px; font-size: 1.2rem; padding: 14px 30px; background: var(--horizon); color: var(--ink); }
  .note { text-align: center; font-size: .9rem; opacity: .8; }
</style>
</head>
<body>
<main>
  <!-- Home -->
  <section id="home" class="hidden">
    <h1>Message in a Bottle</h1>
    <p class="sub">Everyone writes a kind note. When you release, the notes are shuffled so each person gets one from someone else, on screen and by email.</p>
    <div class="center">
      <svg class="big-bottle" viewBox="0 0 120 220" width="70" height="128" aria-hidden="true"><rect x="41" y="96" width="38" height="92" rx="7" fill="#f3e6c6"/><rect x="41" y="136" width="38" height="6" fill="#a7463a"/><path d="M45 40 L45 62 C45 72 20 80 20 100 L20 196 Q20 210 34 210 L86 210 Q100 210 100 196 L100 100 C100 80 75 72 75 62 L75 40 Z" fill="rgba(150,210,190,0.38)" stroke="rgba(225,248,240,0.85)" stroke-width="2.5"/><path d="M29 116 L29 186" stroke="rgba(255,255,255,.35)" stroke-width="5" stroke-linecap="round"/><rect x="41" y="34" width="38" height="9" rx="3" fill="rgba(190,230,215,.7)"/><rect x="46" y="12" width="28" height="26" rx="5" fill="#a9774a"/></svg>
      <button id="startBtn" type="button" class="release">Start a round</button>
      <p class="error center" id="homeErr" role="alert"></p>
    </div>
  </section>

  <!-- Live round -->
  <section id="live" class="hidden">
    <h1>Share this with your group</h1>
    <div class="card">
      <div class="code" id="codeText"></div>
      <div class="qr" id="qr"></div>
      <p class="link" id="joinLink"></p>
      <div class="row">
        <button id="copyBtn" type="button">Copy link</button>
        <button id="endBtn" type="button" class="ghost">Abandon round</button>
      </div>
    </div>
    <p class="count"><strong id="count">0</strong><span id="countLabel">bottles in the sea</span></p>
    <button id="releaseBtn" type="button" class="release" disabled>Release</button>
    <p class="note" id="releaseNote">You need at least 2 bottles to release.</p>
    <p class="error center" id="liveErr" role="alert"></p>
  </section>

  <!-- Done -->
  <section id="done" class="hidden">
    <h1 id="doneTitle">The bottles are out.</h1>
    <p class="sub" id="doneText"></p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
  var KEY = "bottle_host";
  var host = bottleStore.get(KEY);
  var timer = null;
  var count = 0;
  var releasing = false;

  function show(id) {
    ["home", "live", "done"].forEach(function (s) {
      document.getElementById(s).classList.toggle("hidden", s !== id);
    });
  }
  function joinUrl(code) {
    return location.href.replace(/[#?].*$/, "").replace(/host\.html$/, "") + "room.html?r=" + code;
  }
  function goHome() {
    clearInterval(timer);
    bottleStore.del(KEY);
    host = null;
    releasing = false;
    show("home");
  }

  function renderLive() {
    var url = joinUrl(host.code);
    document.getElementById("codeText").textContent = host.code;
    document.getElementById("joinLink").textContent = url;
    var qr = document.getElementById("qr");
    qr.innerHTML = "";
    if (window.QRCode) new QRCode(qr, { text: url, width: 180, height: 180 });
    show("live");
    refresh();
    clearInterval(timer);
    timer = setInterval(refresh, 4000);
  }

  function setCount(n) {
    count = n;
    document.getElementById("count").textContent = n;
    document.getElementById("countLabel").textContent = n === 1 ? "bottle in the sea" : "bottles in the sea";
    var btn = document.getElementById("releaseBtn");
    btn.disabled = releasing || n < 2;
    document.getElementById("releaseNote").textContent = n < 2
      ? "You need at least 2 bottles to release."
      : "Releasing shuffles the notes, shows everyone their bottle, and emails it to them.";
  }

  async function refresh() {
    if (!host || releasing) return;
    try {
      var r = await bottleApi("hostStatus", { code: host.code, hostKey: host.hostKey });
      if (r.status !== "open") { goHome(); return; }
      setCount(r.count);
      document.getElementById("liveErr").textContent = "";
    } catch (e) {
      if (/no longer exists|Only the host/.test(e.message)) goHome();
      else document.getElementById("liveErr").textContent = e.message;
    }
  }

  document.getElementById("startBtn").addEventListener("click", async function () {
    var btn = this;
    btn.disabled = true;
    document.getElementById("homeErr").textContent = "";
    try {
      var r = await bottleApi("createRoom");
      host = { code: r.code, hostKey: r.hostKey };
      bottleStore.set(KEY, host);
      renderLive();
    } catch (e) {
      document.getElementById("homeErr").textContent = e.message;
    }
    btn.disabled = false;
  });

  document.getElementById("copyBtn").addEventListener("click", function () {
    var btn = this, url = joinUrl(host.code);
    var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy link"; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () {});
  });

  document.getElementById("endBtn").addEventListener("click", function () {
    if (confirm("Abandon this round? Nobody will get a bottle, and you'll go back to the start.")) goHome();
  });

  document.getElementById("releaseBtn").addEventListener("click", async function () {
    if (releasing) return;
    if (!confirm("Release " + count + " bottles now? This can't be undone.")) return;
    releasing = true;
    var btn = this;
    btn.disabled = true;
    btn.textContent = "Releasing...";
    clearInterval(timer);
    try {
      var r = await bottleApi("release", { code: host.code, hostKey: host.hostKey });
      bottleStore.del(KEY);
      document.getElementById("doneTitle").textContent = "The bottles are out.";
      document.getElementById("doneText").textContent = r.sent + " bottles sent" +
        (r.failed ? ", " + r.failed + " email" + (r.failed === 1 ? "" : "s") + " failed (those students can still see theirs on screen)." : ".");
      show("done");
      setTimeout(goHome, 5000);
    } catch (e) {
      if (e.data && e.data.already) { goHome(); return; }
      releasing = false;
      btn.textContent = "Release";
      setCount(count);
      document.getElementById("liveErr").textContent = e.message;
      timer = setInterval(refresh, 4000);
    }
  });

  if (host && host.code) renderLive(); else show("home");
</script>
</body>
</html>
